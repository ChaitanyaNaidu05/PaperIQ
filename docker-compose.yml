version: '3.8'

services:
  paperiq:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./data/paperiq.db:/app/data/paperiq.db
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
